# 红果短剧去广告 · Quantumult X 重写规则
# 由公开规则转写为 QX 格式：
#   hongguo-lite Plus（Surge Map Local）
#   egern-hongguo-adblock（Egern URL 重写）
# 配合分流里的 hongguo.list（域名拦截）一起用。
#
# 注意：重写需要 QX 的 MitM 证书已安装并信任
# （iOS 设置 → 通用 → 关于本机 → 证书信任设置里开启信任）。
# 若启用后红果打不开 / 一直转圈（*.snssdk.com 证书固定），
# 停用本重写，只留分流里的 hongguo.list 即可。

# 穿山甲广告接口 → 返回空 JSON（不断连接，App 不会当成网络错误重试）
^https://[^/]*pangolin-sdk-toutiao[^/]*/api/ad/union/sdk/ url reject-dict
# 红果自家 API 下发的广告 → 返回空 JSON
^https://[^/]*\.snssdk\.com/api/ad/ url reject-dict
# 广告视频与素材路径 → 直接拒绝
^https://[^/]*\.(pglstatp-toutiao|pstatp)\.com/(obj|img)/(ad-app-package|ad|ad-pattern)/ url reject

hostname = *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao-b.com, *.pangolin-sdk-toutiao1.com, *.pglstatp-toutiao.com, *.pstatp.com, *.snssdk.com
